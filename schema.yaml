    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          nullable: true
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - updated_at
    UserRegistration:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        password_confirmation:
          type: string
          writeOnly: true
      required:
      - email
      - password
      - password_confirmation
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Send the access JWT in the Authorization header as `Bearer <token>`.
        If this header is present, cookie authentication is not attempted.
    CookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Send the access JWT in the `access_token` cookie. This is used
        only when the Authorization header is absent.
