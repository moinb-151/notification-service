openapi: 3.0.3
info:
  title: Notification Service API
  version: 1.0.0
  description: REST API for user authentication, order management, notification preferences,
    and notifications.
paths:
  /notifications/:
    get:
      operationId: notifications_list
      parameters:
      - in: query
        name: channel
        schema:
          type: string
          enum:
          - email
          - in_app
          - sms
      - in: query
        name: event_type
        schema:
          type: string
          enum:
          - ORDER_CANCELLED
          - ORDER_CONFIRMED
          - ORDER_CREATED
          - ORDER_DELIVERED
          - ORDER_SHIPPED
          - PAYMENT_FAILED
          - PAYMENT_SUCCESS
          - TEST_NOTIFICATION
      - in: query
        name: is_read
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - deferred
          - failed
          - pending
          - sent
          - suppressed
      tags:
      - notifications
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /notifications/{notification_id}/:
    get:
      operationId: notification_retrieve
      parameters:
      - in: path
        name: notification_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - notifications
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
    patch:
      operationId: notification_mark_read
      parameters:
      - in: path
        name: notification_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - notifications
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /notifications/preferences/:
    get:
      operationId: notification_preferences_list
      tags:
      - notifications
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreference'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
    put:
      operationId: notification_preferences_replace
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferenceBulkUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NotificationPreferenceBulkUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NotificationPreferenceBulkUpdate'
        required: true
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationPreference'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Field-keyed validation errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /notifications/preferences/{channel}/:
    patch:
      operationId: notification_preference_update
      parameters:
      - in: path
        name: channel
        schema:
          type: string
        required: true
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreferenceUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreferenceUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNotificationPreferenceUpdate'
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreference'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Field-keyed validation errors.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /notifications/replay/{notification_id}/:
    post:
      operationId: notification_replay_create
      parameters:
      - in: path
        name: notification_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - notifications
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReplayResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /notifications/stream/:
    get:
      operationId: notification_stream_connect
      parameters:
      - in: header
        name: Last-Event-ID
        schema:
          type: string
        description: Resume the event stream after this notification ID.
      tags:
      - notifications
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            text/event-stream:
              schema:
                type: string
          description: 'Server-Sent Events stream. Each notification is sent as an
            `id`, `event: notification`, and JSON `data` field; heartbeat comments
            are sent while idle.'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /orders/:
    get:
      operationId: orders_list
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number within the paginated order results.
      tags:
      - orders
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPagination'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
    post:
      operationId: orders_create
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
        description: Required key used to make order creation idempotent.
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreate'
        required: true
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Field-keyed validation errors, or a detail message when the
            Idempotency-Key header is missing.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /orders/{order_id}/:
    get:
      operationId: order_retrieve
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
    patch:
      operationId: order_update
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrderUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrderUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrderUpdate'
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Field-keyed validation errors.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /orders/{order_id}/cancel/:
    patch:
      operationId: order_cancel
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /orders/products/:
    get:
      operationId: products_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - orders
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
    post:
      operationId: product_create
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Product'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Product'
        required: true
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Field-keyed validation errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /orders/products/{product_id}/:
    get:
      operationId: product_retrieve
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
    put:
      operationId: product_replace
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Field-keyed validation errors.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
    patch:
      operationId: product_update
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProduct'
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Field-keyed validation errors.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
    delete:
      operationId: product_delete
      parameters:
      - in: path
        name: product_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /users/login/:
    post:
      operationId: user_login_create
      description: Authenticates a user using their email and password. On successful
        authentication, sets the access and refresh tokens in HTTP cookies and returns
        the user's information.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Field-keyed validation errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /users/logout/:
    post:
      operationId: user_logout
      parameters:
      - in: cookie
        name: refresh_token
        schema:
          type: string
        description: Optional refresh JWT cookie to blacklist. This is separate from
          the optional access-token cookie used for request authentication.
      tags:
      - users
      security:
      - BearerAuth: []
      - CookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /users/me/:
    get:
      operationId: user_profile_retrieve
      tags:
      - users
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
    patch:
      operationId: user_profile_update
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Field-keyed validation errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /users/refresh/:
    post:
      operationId: token_refresh
      parameters:
      - in: cookie
        name: refresh_token
        schema:
          type: string
        description: Refresh JWT cookie required to complete token refresh. This is
          separate from the optional access-token cookie used for request authentication.
        required: true
      tags:
      - users
      security:
      - BearerAuth: []
      - CookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /users/register/:
    post:
      operationId: user_registration_create
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistration'
        required: true
      security:
      - BearerAuth: []
      - CookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Field-keyed validation errors.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
  /users/test/:
    get:
      operationId: auth_test_retrieve
      tags:
      - users
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
          description: ''
components:
  schemas:
    ChannelEnum:
      enum:
      - email
      - sms
      - in_app
      type: string
      description: |-
        * `email` - Email
        * `sms` - SMS
        * `in_app` - In-App
    ErrorDetail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    EventTypeEnum:
      enum:
      - ORDER_CREATED
      - ORDER_CONFIRMED
      - ORDER_CANCELLED
      - ORDER_SHIPPED
      - ORDER_DELIVERED
      - PAYMENT_SUCCESS
      - PAYMENT_FAILED
      - TEST_NOTIFICATION
      type: string
      description: |-
        * `ORDER_CREATED` - Order Created
        * `ORDER_CONFIRMED` - Order Confirmed
        * `ORDER_CANCELLED` - Order Cancelled
        * `ORDER_SHIPPED` - Order Shipped
        * `ORDER_DELIVERED` - Order Delivered
        * `PAYMENT_SUCCESS` - Payment Success
        * `PAYMENT_FAILED` - Payment Failed
        * `TEST_NOTIFICATION` - Test Notification
    Login:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        message:
          type: string
        user:
          allOf:
          - $ref: '#/components/schemas/PublicUser'
          readOnly: true
      required:
      - message
      - user
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        user:
          $ref: '#/components/schemas/PublicUser'
        order:
          $ref: '#/components/schemas/Order'
        channel:
          $ref: '#/components/schemas/ChannelEnum'
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/NotificationStatusEnum'
          readOnly: true
        payload: {}
        provider_message_id:
          type: string
          readOnly: true
          nullable: true
        is_read:
          type: boolean
        attempts:
          type: integer
          readOnly: true
        last_attempted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        scheduled_for:
          type: string
          format: date-time
          nullable: true
        error_message:
          type: string
          nullable: true
        sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
